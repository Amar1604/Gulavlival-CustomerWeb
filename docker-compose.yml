version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gulavlival-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_here}
      POSTGRES_DB: ${POSTGRES_DB:-gulavlival_grand}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gulavlival_grand"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: gulavlival-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_here}@postgres:5432/${POSTGRES_DB:-gulavlival_grand}
      SECRET_KEY: ${SECRET_KEY:-change_this_jwt_secret_key_in_production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  customer-web:
    build:
      context: ./apps/customer-web
      dockerfile: Dockerfile
    container_name: gulavlival-customer-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_APP_NAME: "Gulavlival Grand"
      NEXT_PUBLIC_ENABLE_QR_ORDERING: "true"
      NEXT_PUBLIC_ENABLE_DELIVERY: "true"
      NEXT_PUBLIC_ENABLE_TAKEAWAY: "true"
      NEXT_PUBLIC_ENABLE_DINE_IN: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/customer-web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
